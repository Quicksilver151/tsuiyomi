name: Host runtime jar

on:
  push:
    tags: ["host-v*"]

permissions:
  contents: write

concurrency:
  group: host-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-jar:
    name: build and publish the patched host jar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: host-gradle-${{ hashFiles('scripts/build-host-runtime.sh', 'scripts/host-patches/miwayomi-0.2.9.patch') }}

      - name: Verify the tag matches the pinned host version
        shell: bash
        run: |
          version="$(sed -n 's/^HOST_VERSION="\(.*\)"/\1/p' scripts/build-host-runtime.sh)"
          if [[ "${GITHUB_REF_NAME}" != "host-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match host-v${version}" >&2
            exit 1
          fi

      - name: Build the patched host jar
        env:
          TSUIYOMI_HOST_SKIP_JRE: "1"
        run: ./scripts/build-host-runtime.sh

      - name: Prepare release assets
        shell: bash
        run: |
          version="$(sed -n 's/^HOST_VERSION="\(.*\)"/\1/p' scripts/build-host-runtime.sh)"
          jar="miwayomi-${version}-patched.jar"
          cp target/host-runtime/miwayomi.jar "${jar}"
          sha256sum "${jar}" > "${jar}.sha256"
          cat "${jar}.sha256"

      - name: Publish the host release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^HOST_VERSION="\(.*\)"/\1/p' scripts/build-host-runtime.sh)"
          tag="${GITHUB_REF_NAME}"
          files=("miwayomi-${version}-patched.jar" "miwayomi-${version}-patched.jar.sha256")
          notes="Patched miwayomi ${version} jar used by tsuiyomi release builds and the Nix package. Platform-independent; each release target builds its own JRE."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "Extension host ${version}" \
              --notes "${notes}" \
              --latest=false
          fi
