[workspace]
members = [
    "crates/tsuiyomi-core",
    "crates/tsuiyomi-tui",
    "crates/tsuiyomi",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
tsuiyomi-core = { path = "crates/tsuiyomi-core" }
tsuiyomi-tui = { path = "crates/tsuiyomi-tui" }

confy = "2.0.0"
crossterm = "0.29.0"
directories = "6.0.0"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
natord = "1.0.9"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.16.0"
thiserror = "2.0.21"
toml = "0.9.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true

# Image decode/resize/encode is painfully slow without optimization.
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
