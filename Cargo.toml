[package]
name = "tsuiyomi"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
strip = true

[dependencies]
confy = "2.0.0"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
