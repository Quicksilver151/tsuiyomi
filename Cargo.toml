[workspace]
members = [
    "crates/tsuiyomi-core",
    "crates/tsuiyomi-tui",
    "crates/tsuiyomi",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Quicksilver151/tsuiyomi"
homepage = "https://github.com/Quicksilver151/tsuiyomi"
readme = "README.md"
keywords = ["manga", "tui", "mihon", "tachiyomi", "terminal"]
categories = ["command-line-utilities", "multimedia"]

[workspace.dependencies]
tsuiyomi-core = { path = "crates/tsuiyomi-core" }
tsuiyomi-tui = { path = "crates/tsuiyomi-tui" }

base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3.4"
confy = "2.0.0"
crossterm = "0.29.0"
directories = "6.0.0"
flate2 = "1.1.11"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
natord = "1.0.9"
quick-xml = "0.38.3"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sevenz-rust2 = "0.20.2"
tar = "0.4.46"
tempfile = "3.16.0"
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = { version = "2.12.1", features = ["json"] }
toml = "0.9.0"
unicode-width = "0.2.3"
unrar = "0.5.8"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true

# Image decode/resize/encode is painfully slow without optimization.
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
